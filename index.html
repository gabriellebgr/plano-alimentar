<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Plano alimentar de 1.400 kcal: Dia A e Dia B alternados, domingo livre, marmitas, compras e trocas.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Plano 1.400">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#F2F4F0" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#101411" media="(prefers-color-scheme: dark)">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Plano Alimentar 1.400</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600..800&family=Caveat:wght@700&family=Inter:wght@400;500;600;700&display=swap">
<style>
:root{
  /* Layout: coluna única de app (até 760px) com cabeçalho fixo; abas no topo no computador e embaixo no celular.
     Cores: Dia A = abóbora, Dia B = vagem, Livre = lavanda; marmitas levam etiqueta de fita crepe. */
  --bg:#F2F4F0; --surface:#FFFFFF; --surface-2:#E9EDE6; --ink:#17201A; --ink-2:#55605A; --line:#D6DCD3;
  --a:#B4560E; --a-soft:#FBEADB; --b:#12706A; --b-soft:#DBEFEA; --free:#5E4E9E; --free-soft:#ECE8F7;
  --water:#2A74A6; --danger:#A3352B; --danger-soft:#F8E4E1;
  --tape:#EFE5C5; --tape-ink:#4A3E1B;
  --shadow:0 1px 2px rgba(23,32,26,.05),0 8px 20px -12px rgba(23,32,26,.18);
  --f-display:"Bricolage Grotesque","Inter",system-ui,sans-serif;
  --f-body:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-hand:"Caveat","Segoe Print","Bradley Hand",cursive;
  --day:var(--a); --day-soft:var(--a-soft);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#101411; --surface:#181D19; --surface-2:#232A25; --ink:#E5EBE5; --ink-2:#A0ACA4; --line:#2E3631;
    --a:#F09A55; --a-soft:#3A2517; --b:#5CC3B3; --b-soft:#11302B; --free:#ADA0EA; --free-soft:#25203C;
    --water:#6CB5E4; --danger:#F08A7E; --danger-soft:#3B1D1A;
    --tape:#4A4330; --tape-ink:#F2E8C8;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 20px -12px rgba(0,0,0,.6);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#101411; --surface:#181D19; --surface-2:#232A25; --ink:#E5EBE5; --ink-2:#A0ACA4; --line:#2E3631;
  --a:#F09A55; --a-soft:#3A2517; --b:#5CC3B3; --b-soft:#11302B; --free:#ADA0EA; --free-soft:#25203C;
  --water:#6CB5E4; --danger:#F08A7E; --danger-soft:#3B1D1A;
  --tape:#4A4330; --tape-ink:#F2E8C8;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 20px -12px rgba(0,0,0,.6);
  color-scheme:dark;
}
[data-dia="A"]{ --day:var(--a); --day-soft:var(--a-soft); }
[data-dia="B"]{ --day:var(--b); --day-soft:var(--b-soft); }
[data-dia="L"]{ --day:var(--free); --day-soft:var(--free-soft); }

*,*::before,*::after{ box-sizing:border-box; }
body{ background:var(--bg); color:var(--ink); font-family:var(--f-body); font-size:15px; line-height:1.5; -webkit-font-smoothing:antialiased; }
body::before{ content:""; position:fixed; inset:0 0 auto; height:env(safe-area-inset-top,0px); z-index:30; background:var(--bg); }
button{ font:inherit; color:inherit; }
a{ color:inherit; }
:focus-visible{ outline:2px solid var(--day); outline-offset:2px; border-radius:6px; }
.wrap{ width:100%; max-width:760px; margin-inline:auto; padding-left:max(16px,env(safe-area-inset-left,0px)); padding-right:max(16px,env(safe-area-inset-right,0px)); }

/* Cabeçalho e abas */
.top{ position:sticky; top:env(safe-area-inset-top,0px); z-index:20; background:var(--bg); border-bottom:1px solid var(--line); }
.top-in{ display:flex; align-items:center; justify-content:space-between; gap:12px; padding-block:12px; }
.brand{ display:flex; align-items:center; gap:12px; min-width:0; }
.scale{ flex:0 0 auto; font-family:var(--f-display); font-weight:800; font-size:15px; line-height:1; padding:8px 9px 7px; border-radius:9px; background:var(--ink); color:var(--bg); font-variant-numeric:tabular-nums; letter-spacing:.01em; }
.scale small{ font-size:10px; font-weight:600; margin-left:3px; opacity:.75; }
.brand-t{ min-width:0; }
.brand h1{ margin:0; font-family:var(--f-display); font-size:18px; font-weight:800; line-height:1.15; letter-spacing:-.01em; }
.brand p{ margin:0; font-size:13px; color:var(--ink-2); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.badge{ flex:0 0 auto; font-weight:700; font-size:13px; padding:6px 11px; border-radius:999px; background:var(--day-soft); color:var(--day); white-space:nowrap; }
.tabs{ display:flex; gap:2px; }
.tab{ flex:1 1 0; min-width:0; display:flex; flex-direction:column; align-items:center; gap:3px; padding:7px 2px 6px; border-radius:11px; color:var(--ink-2); text-decoration:none; font-size:11.5px; font-weight:600; }
.tab svg{ width:22px; height:22px; flex:0 0 auto; }
.tab[aria-current="page"]{ color:var(--ink); background:var(--surface-2); }
@media (min-width:720px){
  .tabs-wrap{ border-top:1px solid var(--line); }
  .tabs{ padding-block:6px; gap:4px; }
  .tab{ flex:0 0 auto; flex-direction:row; gap:8px; padding:8px 14px; font-size:14px; }
  .tab svg{ width:18px; height:18px; }
}
@media (max-width:719px){
  .tabs-wrap{ position:fixed; left:0; right:0; bottom:0; z-index:25; background:var(--surface); border-top:1px solid var(--line); padding-bottom:env(safe-area-inset-bottom,0px); }
  .tabs{ padding-block:6px; }
  main{ padding-bottom:calc(92px + env(safe-area-inset-bottom,0px)) !important; }
}

/* Estrutura */
main{ padding-block:18px 48px; }
.view{ display:flex; flex-direction:column; gap:14px; }
.block{ display:flex; flex-direction:column; gap:10px; }
.card{ background:var(--surface); border:1px solid var(--line); border-radius:14px; padding:14px 16px; }
.eyebrow{ margin:0; font-size:12px; font-weight:600; letter-spacing:.07em; text-transform:uppercase; color:var(--ink-2); }
.h2{ margin:0; font-family:var(--f-display); font-weight:800; font-size:27px; line-height:1.08; letter-spacing:-.02em; text-wrap:balance; }
.h3{ margin:0; font-family:var(--f-display); font-weight:700; font-size:18px; line-height:1.2; letter-spacing:-.01em; text-wrap:balance; }
.lead{ margin:0; color:var(--ink-2); max-width:62ch; }
.sec{ margin-top:14px; display:flex; flex-direction:column; gap:10px; }
.bul{ margin:0; padding-left:18px; display:flex; flex-direction:column; gap:6px; }
.bul li::marker{ color:var(--ink-2); }
.hint{ margin:0; font-size:12.5px; color:var(--ink-2); }
.link{ border:0; background:none; padding:0; font-weight:600; text-decoration:underline; text-decoration-color:var(--day); text-decoration-thickness:2px; text-underline-offset:3px; cursor:pointer; }
.btns{ display:flex; gap:8px; flex-wrap:wrap; }
.btn{ border:1px solid var(--ink); border-radius:10px; padding:9px 14px; min-height:42px; font-weight:600; background:var(--ink); color:var(--surface); cursor:pointer; }
.btn.ghost{ background:transparent; color:var(--ink); border-color:var(--line); }
.btn.armado{ background:var(--danger); border-color:var(--danger); color:var(--surface); }
[id^="g-"], .quadro, .rec{ scroll-margin-top:130px; }

/* Etiqueta de fita crepe */
.tape{ display:inline-block; font-family:var(--f-hand); font-weight:700; font-size:20px; line-height:1; letter-spacing:.02em; color:var(--tape-ink); background:var(--tape); padding:3px 10px 1px; transform:rotate(-2.5deg); clip-path:polygon(0 12%,6% 0,52% 6%,95% 0,100% 18%,97% 52%,100% 88%,93% 100%,48% 94%,4% 100%,0 86%,3% 50%); }
.tape.sm{ font-size:17px; padding:2px 8px 0; }

/* Hoje */
.today{ background:var(--day-soft); border-radius:18px; padding:16px; display:flex; flex-direction:column; gap:14px; }
.today-top{ display:flex; align-items:flex-start; justify-content:space-between; gap:12px; flex-wrap:wrap; }
.today .h2{ color:var(--day); font-size:36px; }
.today-sub{ margin:4px 0 0; color:var(--ink-2); font-size:13.5px; }
.seg{ display:inline-flex; gap:2px; padding:3px; border-radius:12px; background:var(--surface); border:1px solid var(--line); }
.seg button{ position:relative; border:0; background:none; padding:7px 12px 9px; min-height:38px; border-radius:9px; font-weight:600; font-size:13.5px; color:var(--ink-2); cursor:pointer; }
.seg button[aria-checked="true"]{ background:var(--ink); color:var(--surface); }
.seg button[data-prog]::after{ content:""; position:absolute; left:50%; bottom:3px; width:4px; height:4px; margin-left:-2px; border-radius:50%; background:currentColor; opacity:.7; }
.prog{ display:flex; flex-direction:column; gap:8px; }
.prog-segs{ display:grid; grid-template-columns:repeat(5,minmax(0,1fr)); gap:4px; }
.prog-segs span{ height:6px; border-radius:3px; background:var(--line); background:color-mix(in srgb, var(--day) 20%, transparent); }
.prog-segs span.on{ background:var(--day); }
.prog p{ margin:0; font-size:13.5px; color:var(--ink-2); font-variant-numeric:tabular-nums; }
.prog b{ color:var(--ink); }
.lembrete{ display:flex; align-items:center; gap:8px; margin:0; font-size:14px; font-weight:600; }
.lembrete svg{ width:18px; height:18px; flex:0 0 auto; color:var(--day); }

/* Refeições */
.meals{ display:flex; flex-direction:column; gap:10px; }
.meal{ background:var(--surface); border:1px solid var(--line); border-radius:14px; }
.meal-h{ display:flex; align-items:center; gap:12px; padding:12px 12px 6px 16px; }
.meal-time{ flex:0 0 auto; width:44px; font-size:12.5px; font-weight:600; color:var(--ink-2); font-variant-numeric:tabular-nums; }
.meal-title{ flex:1 1 auto; min-width:0; }
.meal-title h3{ margin:0; font-size:16px; font-weight:700; display:flex; align-items:center; gap:10px; flex-wrap:wrap; }
.meal-kcal{ font-size:13px; color:var(--ink-2); font-variant-numeric:tabular-nums; }
.meal-b{ padding:0 16px 12px; transition:opacity .2s; }
.meal.done .meal-b{ opacity:.5; }
.meal.done .meal-title h3{ color:var(--ink-2); }
.check{ flex:0 0 auto; width:44px; height:44px; border-radius:50%; border:2px solid var(--line); background:var(--surface); display:grid; place-items:center; cursor:pointer; transition:background .15s, border-color .15s; }
.check svg{ width:20px; height:20px; opacity:0; color:var(--surface); }
.check:hover{ border-color:var(--day); }
.check[aria-checked="true"]{ background:var(--day); border-color:var(--day); }
.check[aria-checked="true"] svg{ opacity:1; }
.grp{ display:flex; justify-content:space-between; align-items:baseline; gap:8px; margin:8px 0 2px; font-size:11px; font-weight:600; letter-spacing:.07em; text-transform:uppercase; color:var(--ink-2); }
.cols{ display:flex; }
.cols span{ width:62px; text-align:right; }
.cols span:last-child{ width:44px; }
.items{ list-style:none; margin:0; padding:0; }
.items li{ display:grid; grid-template-columns:minmax(0,1fr) 62px 44px; align-items:baseline; padding:7px 0; border-top:1px dashed var(--line); }
.items li:first-child{ border-top:0; }
.it-n{ min-width:0; }
.it-n em{ font-style:normal; color:var(--ink-2); }
.it-n small{ display:block; color:var(--ink-2); font-size:12.5px; line-height:1.4; }
.it-g, .it-k{ text-align:right; font-variant-numeric:tabular-nums; }
.it-g{ font-size:13px; color:var(--ink-2); }
.it-k{ font-weight:600; }
.q{ margin-left:6px; padding:0 6px; border-radius:6px; border:1px solid var(--line); background:var(--surface-2); color:var(--ink-2); font-size:11px; font-weight:600; line-height:1.6; cursor:pointer; vertical-align:1px; }
.q:hover{ color:var(--ink); border-color:var(--ink-2); }
.meal-note{ margin:8px 0 0; padding-top:8px; border-top:1px solid var(--line); font-size:13px; color:var(--ink-2); }

/* Água, noite, sincronização */
.agua-h{ display:flex; align-items:baseline; justify-content:space-between; gap:12px; }
.agua-t{ font-size:13.5px; color:var(--ink-2); font-variant-numeric:tabular-nums; }
.agua-t b{ color:var(--ink); }
.copos{ display:grid; grid-template-columns:repeat(8,minmax(0,1fr)); gap:6px; margin:10px 0 8px; }
.copo{ border:0; background:none; padding:2px; color:var(--water); cursor:pointer; border-radius:8px; max-width:100%; }
.copo svg{ display:block; width:100%; height:auto; max-height:48px; }
.copo .agua-fill{ fill:var(--water); opacity:0; transition:opacity .15s; }
.copo[aria-pressed="true"] .agua-fill{ opacity:.85; }
.noite{ display:flex; gap:12px; align-items:flex-start; padding:12px 16px; border-radius:14px; background:var(--surface-2); }
.noite > svg{ flex:0 0 auto; width:22px; height:22px; margin-top:1px; color:var(--water); }
.noite p{ margin:0; }
.sync{ display:flex; align-items:center; gap:7px; margin:2px 0 0; font-size:12px; color:var(--ink-2); }
.sync i{ width:7px; height:7px; border-radius:50%; background:var(--ink-2); }
.sync[data-s="conta"] i{ background:var(--b); }
.sync[data-s="salvando"] i, .sync[data-s="carregando"] i{ background:var(--a); }
.sync[data-s="erro"] i, .sync[data-s="offline"] i{ background:var(--danger); }
.livre-card{ display:flex; flex-direction:column; gap:10px; }
.livre-card p{ margin:0; }

/* Cardápio */
.semana{ display:grid; grid-template-columns:repeat(7,minmax(0,1fr)); gap:6px; padding-top:8px; }
.wd{ position:relative; min-width:0; border:1px solid var(--line); background:var(--surface); border-radius:12px; padding:8px 2px 9px; display:flex; flex-direction:column; align-items:center; gap:1px; cursor:pointer; }
.wd-n{ font-size:11px; font-weight:600; letter-spacing:.05em; text-transform:uppercase; color:var(--ink-2); }
.wd-l{ font-family:var(--f-display); font-weight:800; font-size:21px; line-height:1.15; color:var(--day); }
.wd-l.livre{ font-family:var(--f-body); font-size:11px; font-weight:700; line-height:27px; }
.wd.sel{ background:var(--day-soft); border-color:var(--day); }
.wd.hoje::before{ content:"hoje"; position:absolute; top:-9px; left:50%; transform:translateX(-50%); font-size:10px; font-weight:700; line-height:1.5; padding:0 6px; border-radius:6px; background:var(--ink); color:var(--surface); }
.wd-dot{ position:absolute; top:6px; right:6px; width:6px; height:6px; border-radius:50%; background:var(--water); }
.legenda{ display:flex; flex-wrap:wrap; gap:4px 14px; margin:0; font-size:12.5px; color:var(--ink-2); }
.legenda span{ display:inline-flex; align-items:center; gap:6px; }
.legenda i{ width:6px; height:6px; border-radius:50%; background:var(--water); }
.dia-head{ display:flex; flex-direction:column; gap:12px; padding:16px; border-radius:18px; background:var(--day-soft); }
.dia-head .h2{ color:var(--day); }
.nums{ display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:8px; margin:0; }
.nums div{ background:var(--surface); border-radius:12px; padding:9px 12px; min-width:0; }
.nums dt{ font-size:11.5px; font-weight:600; color:var(--ink-2); }
.nums dd{ margin:0; font-family:var(--f-display); font-weight:800; font-size:21px; line-height:1.3; font-variant-numeric:tabular-nums; white-space:nowrap; }
.nums dd small{ font-family:var(--f-body); font-size:12px; font-weight:600; color:var(--ink-2); }
.nums dd .tape{ font-size:17px; }

/* Preparo */
.marm-grid{ display:grid; gap:10px; grid-template-columns:repeat(2,minmax(0,1fr)); }
.marm{ min-width:0; background:var(--surface); border:1px solid var(--line); border-radius:14px; padding:14px; display:flex; flex-direction:column; gap:8px; }
.marm-top{ display:flex; align-items:center; justify-content:space-between; gap:8px; }
.marm-x{ font-family:var(--f-display); font-weight:800; font-size:19px; color:var(--day); font-variant-numeric:tabular-nums; }
.marm h3{ margin:0; font-size:14.5px; }
.marm ul{ list-style:none; margin:0; padding:0; font-size:13px; }
.marm li{ display:flex; justify-content:space-between; gap:8px; padding:4px 0; border-top:1px dashed var(--line); }
.marm li span:last-child{ color:var(--ink-2); white-space:nowrap; font-variant-numeric:tabular-nums; }
.marm-k{ margin:auto 0 0; font-size:13px; font-weight:700; font-variant-numeric:tabular-nums; }
.passos{ list-style:none; counter-reset:p; margin:0; padding:0; }
.passos li{ counter-increment:p; display:grid; grid-template-columns:30px minmax(0,1fr); gap:10px; align-items:start; padding:9px 0; border-top:1px dashed var(--line); }
.passos li:first-child{ border-top:0; }
.passos li::before{ content:counter(p); width:26px; height:26px; border-radius:50%; display:grid; place-items:center; background:var(--surface-2); font-family:var(--f-display); font-weight:800; font-size:13px; }
.recs{ display:flex; flex-direction:column; gap:8px; }
.rec{ background:var(--surface); border:1px solid var(--line); border-radius:14px; }
.rec summary{ list-style:none; cursor:pointer; display:flex; align-items:center; gap:10px; padding:12px 16px; min-height:48px; font-weight:600; }
.rec summary::-webkit-details-marker{ display:none; }
.rec summary::after{ content:""; flex:0 0 auto; width:8px; height:8px; margin:-4px 2px 0 4px; border-right:2px solid var(--ink-2); border-bottom:2px solid var(--ink-2); transform:rotate(45deg); transition:transform .15s; }
.rec[open] summary::after{ transform:rotate(-135deg); margin-top:4px; }
.rec-n{ min-width:0; }
.rec-m{ margin-left:auto; display:flex; align-items:center; gap:6px; flex-wrap:wrap; justify-content:flex-end; font-size:12.5px; font-weight:500; color:var(--ink-2); }
.rec-b{ padding:2px 16px 16px; display:grid; gap:14px; grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr)); }
.rec-b h4{ margin:0 0 6px; font-size:11px; font-weight:600; letter-spacing:.07em; text-transform:uppercase; color:var(--ink-2); }
.rec-b ul, .rec-b ol{ margin:0; padding-left:18px; display:flex; flex-direction:column; gap:4px; font-size:14px; }
.rec-extra{ grid-column:1/-1; margin:0; font-size:13px; font-weight:600; }

/* Compras */
.cbar{ display:flex; align-items:center; gap:12px; }
.cbar .line{ flex:1; height:6px; border-radius:3px; background:var(--surface-2); overflow:hidden; }
.cbar .line span{ display:block; height:100%; background:var(--b); border-radius:3px; transition:width .2s; }
.cbar-t{ font-size:13px; color:var(--ink-2); font-variant-numeric:tabular-nums; white-space:nowrap; }
.cbar-t b{ color:var(--ink); }
.copia{ width:100%; min-height:180px; font:13px/1.5 var(--f-body); padding:10px 12px; border-radius:10px; border:1px solid var(--line); background:var(--surface); color:var(--ink); resize:vertical; }
.cgrupo{ padding-bottom:6px; }
.clist{ list-style:none; margin:6px 0 0; padding:0; }
.clist li + li{ border-top:1px dashed var(--line); }
.ci{ position:relative; display:flex; align-items:flex-start; gap:12px; padding:10px 0; cursor:pointer; }
.ci input{ position:absolute; opacity:0; width:1px; height:1px; margin:0; }
.ci-box{ flex:0 0 auto; width:24px; height:24px; margin-top:1px; border-radius:7px; border:2px solid var(--line); background:var(--surface); display:grid; place-items:center; transition:background .15s, border-color .15s; }
.ci-box svg{ width:15px; height:15px; opacity:0; color:var(--surface); }
.ci input:checked + .ci-box{ background:var(--b); border-color:var(--b); }
.ci input:checked + .ci-box svg{ opacity:1; }
.ci input:focus-visible + .ci-box{ outline:2px solid var(--b); outline-offset:2px; }
.ci-t{ min-width:0; display:flex; flex-wrap:wrap; align-items:baseline; column-gap:8px; }
.ci-n{ font-weight:600; }
.ci-q{ color:var(--ink-2); font-variant-numeric:tabular-nums; }
.ci-t small{ flex-basis:100%; font-size:12.5px; color:var(--ink-2); }
.ci input:checked ~ .ci-t .ci-n{ text-decoration:line-through; color:var(--ink-2); }

/* Guia */
.jump{ display:flex; flex-wrap:wrap; gap:8px; }
.jump button{ border:1px solid var(--line); background:var(--surface); border-radius:999px; padding:7px 14px; min-height:38px; font-size:13.5px; font-weight:600; cursor:pointer; }
.quadros{ display:grid; gap:10px; grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr)); align-items:start; }
.quadro{ background:var(--surface); border:1px solid var(--line); border-radius:14px; padding:14px 16px; }
.quadro header{ display:flex; gap:12px; align-items:flex-start; margin-bottom:6px; }
.qn{ flex:0 0 auto; font-family:var(--f-display); font-weight:800; font-size:14px; line-height:1; padding:6px 8px; border-radius:8px; background:var(--surface-2); }
.quadro h3{ margin:0; font-size:16px; }
.quadro header p{ margin:2px 0 0; font-size:13px; color:var(--ink-2); }
.qlist{ list-style:none; margin:0; padding:0; }
.qlist li{ display:flex; justify-content:space-between; gap:12px; padding:6px 0; border-top:1px dashed var(--line); font-size:14px; }
.qlist li span:last-child{ text-align:right; color:var(--ink-2); }
.qlist li small{ display:block; font-size:12px; color:var(--ink-2); }
.qchips{ list-style:none; margin:4px 0 0; padding:0; display:flex; flex-wrap:wrap; gap:6px; }
.qchips li{ padding:3px 10px; border-radius:999px; background:var(--surface-2); font-size:13.5px; }
.qnota{ margin:10px 0 0; font-size:12.5px; color:var(--ink-2); }
.quadro.flash{ animation:flash 1.8s ease-out; }
@keyframes flash{ 0%,45%{ box-shadow:0 0 0 3px var(--a); } 100%{ box-shadow:0 0 0 0 transparent; } }
.pl{ display:grid; gap:10px; grid-template-columns:repeat(auto-fit,minmax(min(100%,280px),1fr)); }
.chips-p li{ background:var(--danger-soft); color:var(--danger); font-weight:600; }
.chips-l li{ background:var(--b-soft); color:var(--b); font-weight:600; }
.regras{ display:grid; gap:10px; }
.regras .card h3{ margin-bottom:8px; }
.fonte{ margin:0; font-size:13px; color:var(--ink-2); }

.toast{ position:fixed; left:50%; transform:translateX(-50%); bottom:calc(20px + env(safe-area-inset-bottom,0px)); z-index:40; max-width:calc(100% - 32px); padding:10px 16px; border-radius:12px; background:var(--ink); color:var(--surface); font-weight:600; font-size:14px; box-shadow:var(--shadow); }
@media (max-width:719px){ .toast{ bottom:calc(86px + env(safe-area-inset-bottom,0px)); } }
@media (max-width:380px){
  .today .h2{ font-size:30px; }
  .nums dd{ font-size:18px; }
  .marm-grid{ grid-template-columns:minmax(0,1fr); }
}
.instalar{ display:flex; align-items:center; justify-content:space-between; gap:12px; }
.instalar p{ margin:0; font-size:14px; }
.nao-come{ margin:0; padding:12px 14px; border-radius:12px; background:var(--surface-2); font-size:13.5px; color:var(--ink-2); }
.nao-come b{ color:var(--ink); }
.cnota{ margin:4px 0 0; font-size:12.5px; color:var(--ink-2); }

/* Peso e água */
.campos{ display:flex; flex-wrap:wrap; gap:10px; align-items:flex-end; margin:10px 0 8px; }
.campo{ display:flex; flex-direction:column; gap:4px; flex:1 1 130px; min-width:0; font-size:12.5px; font-weight:600; color:var(--ink-2); }
.campo input{ font:inherit; font-size:16px; font-weight:500; color:var(--ink); background:var(--bg); border:1px solid var(--line); border-radius:10px; padding:8px 12px; min-height:44px; width:100%; }
.campo input:focus-visible{ outline:2px solid var(--b); outline-offset:1px; }
.stats{ display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:8px; margin:0; }
.stats > div{ background:var(--surface); border:1px solid var(--line); border-radius:12px; padding:10px 12px; min-width:0; }
.stats dt{ font-size:11.5px; font-weight:600; color:var(--ink-2); }
.stats dd{ margin:0; font-family:var(--f-display); font-weight:800; font-size:22px; line-height:1.25; font-variant-numeric:tabular-nums; }
.stats dd small{ display:block; font-family:var(--f-body); font-size:12px; font-weight:500; color:var(--ink-2); }
.grafico svg{ display:block; width:100%; height:auto; margin-top:6px; }
.registros{ list-style:none; margin:6px 0 0; padding:0; }
.registros li{ display:flex; align-items:center; gap:10px; padding:8px 0; border-top:1px dashed var(--line); font-variant-numeric:tabular-nums; }
.registros li:first-child{ border-top:0; }
.registros .rd{ flex:0 0 auto; width:88px; color:var(--ink-2); }
.registros .rk{ font-weight:700; }
.registros .rv{ font-size:13px; color:var(--ink-2); }
.registros .del{ margin-left:auto; min-height:34px; padding:4px 10px; border:1px solid var(--line); border-radius:8px; background:none; font-size:12.5px; font-weight:600; color:var(--ink-2); cursor:pointer; }
.registros .del.armado{ background:var(--danger); border-color:var(--danger); color:var(--surface); }
.aviso-peso{ display:flex; align-items:center; justify-content:space-between; gap:12px; }
.aviso-peso p{ margin:0; font-size:14px; }

/* Macronutrientes */
.macros{ display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:8px; margin:0; }
.macros > div{ background:var(--surface); border-radius:12px; padding:9px 10px; min-width:0; }
.macros dt{ font-size:11.5px; font-weight:600; color:var(--ink-2); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.macros dd{ margin:0; font-family:var(--f-display); font-weight:800; font-size:19px; line-height:1.3; font-variant-numeric:tabular-nums; white-space:nowrap; }
.macros dd small{ font-family:var(--f-body); font-size:11.5px; font-weight:600; color:var(--ink-2); }
.macros dd.st{ display:flex; align-items:center; gap:4px; margin-top:2px; font-family:var(--f-body); font-size:11.5px; font-weight:500; line-height:1.3; color:var(--ink-2); white-space:normal; }
.macros dd.st svg{ width:13px; height:13px; flex:0 0 auto; }
@media (max-width:520px){ .macros{ grid-template-columns:repeat(2,minmax(0,1fr)); } }
.tabela-wrap{ overflow-x:auto; }
.tabela{ width:100%; border-collapse:collapse; font-size:14px; font-variant-numeric:tabular-nums; }
.tabela th, .tabela td{ text-align:left; padding:8px 8px 8px 0; border-top:1px dashed var(--line); vertical-align:top; }
.tabela thead th{ border-top:0; font-size:11px; font-weight:600; letter-spacing:.06em; text-transform:uppercase; color:var(--ink-2); }
.tabela td.n{ white-space:nowrap; }
.tabela tbody th{ font-weight:600; width:55%; }
.tabela small{ display:block; font-size:12px; font-weight:400; line-height:1.35; color:var(--ink-2); }
.tabela td.n{ font-weight:600; }
@media (prefers-reduced-motion: reduce){
  *, *::before, *::after{ transition:none !important; animation:none !important; scroll-behavior:auto !important; }
}
</style>
</head>

as","nome":"Almôndegas ao sugo","rende":"9 almôndegas (3 porções)","para":["A2"],"ing":["400 g de patinho moído","1 ovo","¼ de cebola ralada (30 g)","1 dente de alho amassado","cheiro-verde e sal","Molho: 4 tomates maduros (400 g) batidos","½ cebola (60 g) e 2 dentes de alho","2 col. chá de azeite, orégano e sal"],"passos":["Misture a carne, o ovo, a cebola, o alho, o cheiro-verde e o sal; faça 9 bolinhas.","Asse a 200 °C por 20 a 25 min, sem fritar.","Molho: refogue cebola e alho no azeite, junte os tomates, orégano e sal e cozinhe 15 a 20 min.","Junte as almôndegas ao molho por mais 5 min."]},{"id":"picadinho","nome":"Picadinho de patinho","rende":"3 porções","para":["B1"],"ing":["450 g de patinho em cubos de 2 cm (peça ao açougue)","1 cebola média picada (90 g)","3 dentes de alho","1 tomate grande picado (150 g)","2 col. chá de azeite","1 folha de louro","½ col. chá de páprica, sal e cheiro-verde","1 xícara de água"],"passos":["Na panela de pressão aberta, sele a carne no azeite em 2 levas.","Junte cebola e alho, depois tomate, louro, páprica, sal e a água.","Pressão por 20 min. Abra e apure o caldo por 5 min; finalize com cheiro-verde."]},{"id":"frango_desfiado","nome":"Frango desfiado com cúrcuma","rende":"3 porções","para":["B2"],"ing":["435 g de peito de frango sem pele","1 folha de louro e sal","1 cebola média (90 g)","2 dentes de alho","1 tomate grande picado (150 g)","½ col. chá de cúrcuma","2 col. chá de azeite","cheiro-verde"],"passos":["Cozinhe o frango numa panela comum com água, louro e sal por 20 a 25 min. Desfie com dois garfos e guarde ½ concha do caldo.","Refogue cebola e alho no azeite, junte tomate, cúrcuma, o frango e o caldo; 5 min.","Finalize com cheiro-verde."]},{"id":"brocolini_cf","nome":"Brocolini e couve-flor no vapor","rende":"6 porções de ≈90 g","para":["A1","B1"],"ing":["270 g de brocolini (2 bandejas), sem as pontas duras dos talos","260 g de floretes de couve-flor"],"passos":["Vapor: couve-flor por 4 a 5 min, brocolini por 3 a 4 min /* ---------- Peso e meta de água ---------- */
const AGUA_MIN_ML = 2000, COPO_ML = 250, FATOR_PADRAO = 35;
const fmtKg = n => Number(n).toLocaleString('pt-BR', { minimumFractionDigits: 1, maximumFractionDigits: 1 });
const fmtKgEixo = n => Number(n).toLocaleString('pt-BR', { maximumFractionDigits: 1 });
const fmtL = ml => (ml / 1000).toLocaleString('pt-BR', { maximumFractionDigits: 2 });
const fmtData = iso => { const [y, m, d] = iso.split('-'); return `${d}/${m}/${y}`; };
const fmtDataCurta = iso => { const [, m, d] = iso.split('-'); return `${d}/${m}`; };
const num = s => { const v = parseFloat(String(s == null ? '' : s).trim().replace(/\s/g, '').replace(',', '.')); return Number.isFinite(v) ? v : NaN; };
function pesoState() {
  const s = store.get('peso') || {};
  const registros = (Array.isArray(s.registros) ? s.registros : [])
    .filter(x => x && typeof x.d === 'string' && /^\d{4}-\d{2}-\d{2}$/.test(x.d) && Number.isFinite(x.kg))
    .sort((a, b) => (a.d < b.d ? -1 : a.d > b.d ? 1 : 0));
  return { registros, meta: Number.isFinite(s.meta) ? s.meta : null, fator: Number.isFinite(s.fator) ? s.fator : FATOR_PADRAO };
}
function metaAgua(p) {
  const ultimo = p.registros[p.registros.length - 1] || null;
  const calc = ultimo ? Math.round(ultimo.kg * p.fator) : 0;
  return { ml: Math.max(AGUA_MIN_ML, calc), calc, ultimo };
}

const reduzMovimento = () => { try { return window.matchMedia('(prefers-reduced-motion: reduce)').matches; } catch (e) { return false; } };

const pad = n => String(n).padStart(2, '0');
const dateKey = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const longDate = d => { try { return d.toLocaleDateString('pt-BR', { weekday: 'long', day: 'numeric', month: 'long' }); } catch (e) { return dateKey(d); } };
let today = new Date();
let todayKey = 'dia-' + dateKey(today);

/* ---------- Salvamento: conta (db, privado por pessoa) com cópia neste aparelho ---------- */
const store = (() => {
  const LS = 'plano1400:';
  const slots = new Map();
  let db = null, uid = null, status = 'local';
  let onChange = () => {};
  const TXT = {
    local: 'Salvo neste aparelho',
    carregando: 'Conectando à sua conta…',
    conta: 'Salvo na sua conta',
    salvando: 'Salvando…',
    offline: 'Sem conexão com a conta agora; salvo neste aparelho',
    erro: 'Não deu para salvar na conta; ficou salvo neste aparelho'
  };
  function lsGet(k) { try { const v = localStorage.getItem(LS + k); return v ? JSON.parse(v) : null; } catch (e) { return null; } }
  function lsSet(k, v) { try { localStorage.setItem(LS + k, JSON.stringify(v)); } catch (e) { /* sem armazenamento */ } }
  function slot(k) {
    let s = slots.get(k);
    if (!s) { s = { state: lsGet(k), unsub: null, saving: false, dirty: false, confirmed: false, timer: null, deb: null }; slots.set(k, s); }
    return s;
  }
  function paint() { $$('[data-sync]').forEach(el => { el.dataset.s = status; const sp = el.querySelector('span'); if (sp) sp.textContent = TXT[status]; }); }
  function setStatus(s) { status = s; paint(); }
  function path(k) { return 'data/users/' + uid + '/' + k; }
  function get(k) { return slot(k).state; }
  function set(k, v) {
    const s = slot(k);
    s.state = v; lsSet(k, v); s.dirty = true;
    if (db) { clearTimeout(s.deb); s.deb = setTimeout(() => flush(k), 450); }
  }
  async function flush(k) {
    const s = slot(k);
    if (!db || s.saving || !s.dirty) return;
    s.saving = true; s.dirty = false; setStatus('salvando');
    const body = JSON.parse(JSON.stringify(s.state || {}));
    let ok = false;
    for (let tentativa = 0; tentativa < 2 && !ok; tentativa++) {
      try { await db.doc(path(k)).set(body); ok = true; }
      catch (e) {
        if (!(e && e.code === 'unavailable') || tentativa === 1) break;
        await new Promise(r => setTimeout(r, 600 + Math.random() * 900));
      }
    }
    s.saving = false;
    if (!ok) { setStatus('erro'); return; }
    if (s.dirty) { flush(k); return; }
    setStatus('conta');
  }
  function watch(k) {
    if (!db) return;
    const s = slot(k);
    if (s.unsub) return;
    s.confirmed = false;
    clearTimeout(s.timer);
    s.timer = setTimeout(() => { if (!s.confirmed && status !== 'erro') setStatus('offline'); }, 10000);
    try {
      s.unsub = db.doc(path(k)).onSnapshot(snap => {
        if (!snap.metadata.fromCache && !s.confirmed) {
          s.confirmed = true; clearTimeout(s.timer);
          if (status === 'carregando' || status === 'offline') setStatus('conta');
        }
        if (s.saving || s.dirty || snap.metadata.hasPendingWrites || !snap.exists) return;
        const v = JSON.parse(JSON.stringify(snap.data() || {}));
        if (JSON.stringify(v) === JSON.stringify(s.state)) return;
        s.state = v; lsSet(k, v); onChange(k);
      }, err => {
        clearTimeout(s.timer); s.unsub = null;
        setStatus(err && err.code === 'revoked' ? 'local' : 'offline');
      });
    } catch (e) { clearTimeout(s.timer); setStatus('local'); }
  }
  function unwatch(k) { const s = slots.get(k); if (s && s.unsub) { s.unsub(); s.unsub = null; clearTimeout(s.timer); } }
  async function init(keysFn) {
    paint();
    if (!(window.claude && typeof window.claude.use === 'function')) return;
    try {
      const [dbNs, userNs] = await Promise.all([window.claude.use('db'), window.claude.use('user')]);
      if (!dbNs || !userNs) return;
      const id = await userNs.id();
      if (!id) return;
      db = dbNs; uid = id;
      setStatus('carregando');
      keysFn().forEach(watch);
      slots.forEach((s, k) => { if (s.dirty) flush(k); });
    } catch (e) { setStatus('local'); }
  }
  return { get, set, watch, unwatch, init, paint, set onChange(fn) { onChange = fn; } };
})();

/* ---------- Navegação por abas (#hoje, #cardapio, ...) ---------- */
let atual = null;
function show(v, opts = {}) {
  if (!VIEWS.includes(v)) v = 'hoje';
  if (v === atual) return;
  VIEWS.forEach(x => { document.getElementById('v-' + x).hidden = x !== v; });
  $$('.tab').forEach(a => { if (a.dataset.view === v) a.setAttribute('aria-current', 'page'); else a.removeAttribute('aria-current'); });
  atual = v;
  if (!opts.keepScroll) window.scrollTo(0, 0);
}
function go(v) { show(v); if (location.hash !== '#' + v) location.hash = v; }
window.addEventListener('hashchange', () => show(location.hash.slice(1)));

function keepFocus(fn) {
  const a = document.activeElement;
  const id = a && a.id;
  fn();
  if (id) { const n = document.getElementById(id); if (n && n !== document.activeElement) { try { n.focus({ preventScroll: true }); } catch (e) { n.focus(); } } }
}
let toastTimer = null;
function toast(msg) { const t = $('#toast'); t.textContent = msg; t.hidden = false; clearTimeout(toastTimer); toastTimer = setTimeout(() => { t.hidden = true; }, 2400); }
const tapeSm = c => `<span class="tape sm">${c}</span>`;

/* ---------- Peças de refeição ---------- */
function itemRow(k, prefixo) {
  const it = I[k];
  const q = it.q ? `<button type="button" class="q" data-q="${it.q}" aria-label="Ver trocas do quadro ${it.q.slice(1)}">${it.q}</button>` : '';
  return `<li><span class="it-n">${prefixo ? `<em>${prefixo}</em> ` : ''}${esc(it.nome)}<small>${esc(it.medida)}${q}</small></span><span class="it-g">${esc(it.peso)}</span><span class="it-k">${it.kcal}</span></li>`;
}
function mealCard(m, opt = {}) {
  const cols = '<span class="cols" aria-hidden="true"><span>peso</span><span>kcal</span></span>';
  let corpo;
  if (m.marmita) {
    corpo = `<p class="grp"><span>Na marmita</span>${cols}</p><ul class="items">${m.itens.map(k => itemRow(k)).join('')}</ul>`
      + `<p class="grp"><span>Na hora</span></p><ul class="items">${m.hora_itens.map(k => itemRow(k)).join('')}${m.sobremesa ? itemRow(m.sobremesa, 'Sobremesa:') : ''}</ul>`;
  } else {
    corpo = `<p class="grp"><span>Itens</span>${cols}</p><ul class="items">${m.itens.map(k => itemRow(k)).join('')}</ul>`;
  }
  if (m.id === 'jantar') corpo += `<p class="meal-note">Se preferir, troque o jantar por 1 prato da <button type="button" class="link" data-goto="sopa">sopa do plano</button> (≈${PLAN.sopa.kcal} kcal).</p>`;
  const tape = m.marmita ? `<span class="tape" title="Marmita ${m.marmita}">${m.marmita}</span>` : '';
  const chk = opt.check ? `<button type="button" class="check" role="checkbox" id="chk-${m.id}" data-meal="${m.id}" aria-checked="${opt.done ? 'true' : 'false'}" aria-label="${esc(m.nome)} feita">${ICON.check}</button>` : '';
  return `<article class="meal${opt.done ? ' done' : ''}"><header class="meal-h"><span class="meal-time">${m.hora}</span><div class="meal-title"><h3>${esc(m.nome)}${tape ? ' ' + tape : ''}</h3><span class="meal-kcal">${fmt(m.kcal)} kcal</span></div>${chk}</header><div class="meal-b">${corpo}</div></article>`;
}

/* ---------- Hoje ---------- */
function livreCard() {
  return `<section class="card livre-card" data-dia="L">
    <h3 class="h3">Sem cardápio hoje</h3>
    <p>Você acorda mais tarde e junta ou pula refeições, então organize do seu jeito. Se quiser seguir um cardápio, escolha A ou B acima.</p>
    <ul class="bul">
      <li>Monte os pratos com as <button type="button" class="link" data-goto="trocas">trocas da nutróloga</button>. Os proibidos continuam valendo.</li>
      <li>Mesmo começando tarde, não fique mais de 3 a 4 horas acordada sem comer.</li>
      <li>Jantar leve: a <button type="button" class="link" data-goto="sopa">sopa do plano</button> (≈${PLAN.sopa.kcal} kcal) congela bem.</li>
      <li>Bom dia para a <button type="button" class="link" data-goto="preparo">sessão de marmitas</button> da semana.</li>
    </ul>
  </section>`;
}
function aguaCard(n) {
  const p = pesoState(), m = metaAgua(p);
  const total = Math.max(1, Math.ceil(m.ml / COPO_ML));
  const feito = Math.min(n, total);
  const cols = total <= 8 ? total : Math.ceil(total / Math.ceil(total / 8));
  const copos = Array.from({ length: total }, (_, i) => `<button type="button" class="copo" id="copo-${i + 1}" data-copo="${i + 1}" aria-pressed="${i < feito ? 'true' : 'false'}" aria-label="Copo ${i + 1} de ${total}, 250 mL">${ICON.copo}</button>`).join('');
  const regra = m.ultimo
    ? `${fmtKg(m.ultimo.kg)} kg × ${p.fator} mL = ${fmtL(m.calc)} L${m.calc < AGUA_MIN_ML ? ', abaixo do mínimo da nutróloga, então fica em 2 L' : ''}.`
    : `mínimo da nutróloga. <button type="button" class="link" data-goto="peso">Registre seu peso</button> para calcular por ${p.fator} mL por kg.`;
  return `<section class="card"><div class="agua-h"><h3 class="h3">Água</h3><span class="agua-t"><b>${fmtL(feito * COPO_ML)} L</b> de ${fmtL(m.ml)} L</span></div><div class="copos" style="grid-template-columns:repeat(${cols},minmax(0,1fr))" role="group" aria-label="Copos de água de 250 mL">${copos}</div><p class="hint">Meta: ${regra} Beba fora das refeições, 30 min antes ou depois.</p></section>`;
}
function lembretePeso() {
  const u = pesoState().registros.slice(-1)[0];
  if (!u) return `<section class="card aviso-peso"><p>Registre seu peso para a meta de água acompanhar você.</p><button type="button" class="link" data-goto="peso">Registrar</button></section>`;
  const dias = Math.round((Date.parse(dateKey(today)) - Date.parse(u.d)) / 86400000);
  if (dias < 7) return '';
  return `<section class="card aviso-peso"><p>Seu último peso é de ${fmtDataCurta(u.d)}, há ${dias} dias.</p><button type="button" class="link" data-goto="peso">Registrar o desta semana</button></section>`;
}
function noiteCard() {
  const t = new Date(today); t.setDate(t.getDate() + 1);
  const p = DOW_DIA[t.getDay()];
  const txt = p === 'L'
    ? 'Amanhã é domingo livre: nada para descongelar.'
    : `<b>Hoje à noite:</b> passe ${tapeSm(MARM[p][0])} e ${tapeSm(MARM[p][1])} do freezer para a geladeira. Amanhã é ${NOME_DIA[p]}.`;
  return `<section class="noite">${ICON.floco}<p>${txt}</p></section>`;
}
function bannerInstalar() {
  if (!PWA) return '';
  let dispensado = false;
  try { dispensado = localStorage.getItem('plano1400:instalar-ok') === '1'; } catch (e) { /* sem armazenamento */ }
  let instalado = window.navigator.standalone === true;
  try { instalado = instalado || window.matchMedia('(display-mode: standalone)').matches; } catch (e) { /* sem suporte */ }
  if (instalado || dispensado) return '';
  return `<section class="card instalar"><p><b>Para instalar no iPhone:</b> no Safari, toque em Compartilhar e depois em <b>Adicionar à Tela de Início</b>.</p><button type="button" class="link" id="instalar-ok">Entendi</button></section>`;
}
function renderHoje() {
  const st = store.get(todayKey) || {};
  const prog = DOW_DIA[today.getDay()];
  const dia = (st.dia === 'A' || st.dia === 'B' || st.dia === 'L') ? st.dia : prog;
  const feitos = st.feitos || {};
  const agua = Math.max(0, Math.min(40, Number(st.agua) || 0));
  const sub = dia === prog
    ? (prog === 'L' ? 'Domingo sem cardápio: você organiza.' : `Programado para ${DOW_LONGO[today.getDay()].toLowerCase()}.`)
    : `Trocado só hoje. O programado era ${NOME_DIA[prog]}.`;
  const opcoes = ['A', 'B', 'L'].map(o => `<button type="button" role="radio" id="hoje-${o}" data-set-dia="${o}" aria-checked="${o === dia}"${o === prog ? ' data-prog title="Programado para hoje"' : ''}>${o === 'L' ? 'Livre' : 'Dia ' + o}</button>`).join('');
  let html = `<section class="today" data-dia="${dia}">
    <div class="today-top">
      <div><p class="eyebrow">Hoje · ${esc(longDate(today))}</p><h2 class="h2">${NOME_DIA[dia]}</h2><p class="today-sub">${sub}</p></div>
      <div class="seg" role="radiogroup" aria-label="Cardápio de hoje">${opcoes}</div>
    </div>`;
  if (dia !== 'L') {
    const D = PLAN.dias[dia];
    const nFeitas = MEAL_IDS.filter(id => feitos[id]).length;
    const kFeitas = D.refeicoes.filter(m => feitos[m.id]).reduce((s, m) => s + m.kcal, 0);
    html += `<div class="prog"><div class="prog-segs" aria-hidden="true">${D.refeicoes.map(m => `<span class="${feitos[m.id] ? 'on' : ''}"></span>`).join('')}</div>
      <p><b>${nFeitas} de 5</b> refeições · <b>${fmt(kFeitas)}</b> de ${fmt(D.kcal)} kcal</p></div>`;
  }
  if (today.getDay() === 3) html += `<p class="lembrete">${ICON.sino}Quarta: ${LEMBRETE} hoje à noite.</p>`;
  html += `</section>`;
  html = bannerInstalar() + html + lembretePeso();
  if (dia !== 'L') html += `<div class="meals" data-dia="${dia}">${PLAN.dias[dia].refeicoes.map(m => mealCard(m, { check: true, done: !!feitos[m.id] })).join('')}</div>`;
  else html += livreCard();
  html += aguaCard(agua) + noiteCard() + `<p class="sync" data-sync><i></i><span></span></p>`;
  keepFocus(() => { $('#v-hoje').innerHTML = html; });
  const b = $('#hdr-badge'); b.dataset.dia = dia; b.textContent = NOME_DIA[dia];
  $('#hdr-data').textContent = longDate(today);
  store.paint();
}
function patchHoje(fn) {
  const cur = store.get(todayKey) || {};
  const next = JSON.parse(JSON.stringify(cur));
  fn(next);
  store.set(todayKey, next);
  renderHoje();
}

/* ---------- Cardápio ---------- */
function macrosTiles(mc) {
  const st = s => s === 'dentro' ? `${ICON.ok}na referência` : `${ICON.alerta}${s} da referência`;
  return `<dl class="macros">
    <div><dt>Proteína</dt><dd>${mc.prot} <small>g · ${mc.pct.prot}%</small></dd><dd class="st">${st(mc.status.prot)}</dd></div>
    <div><dt>Carboidratos</dt><dd>${mc.carb} <small>g · ${mc.pct.carb}%</small></dd><dd class="st">${st(mc.status.carb)}</dd></div>
    <div><dt>Gorduras</dt><dd>${mc.gord} <small>g · ${mc.pct.gord}%</small></dd><dd class="st">${st(mc.status.gord)}</dd></div>
    <div><dt>Fibras</dt><dd>${mc.fibra} <small>g</small></dd><dd class="st">${st(mc.status.fibra)}</dd></div></dl>`;
}
let verDia = null;
function renderCardapio() {
  const progHoje = DOW_DIA[today.getDay()];
  const sel = verDia || (progHoje === 'L' ? 'A' : progHoje);
  const semana = ORDEM_SEMANA.map(dow => {
    const l = DOW_DIA[dow];
    const cls = ['wd', l === sel ? 'sel' : '', dow === today.getDay() ? 'hoje' : ''].filter(Boolean).join(' ');
    return `<button type="button" class="${cls}" data-dia="${l}" data-ver="${l}" aria-label="${DOW_LONGO[dow]}: ${NOME_DIA[l]}${dow === 3 ? ', ' + LEMBRETE + ' à noite' : ''}"><span class="wd-n">${DOW_CURTO[dow]}</span><span class="wd-l${l === 'L' ? ' livre' : ''}">${l === 'L' ? 'livre' : l}</span>${dow === 3 ? '<i class="wd-dot"></i>' : ''}</button>`;
  }).join('');
  let html = `<section class="block"><p class="eyebrow">A semana</p><h2 class="h2">Dois cardápios que se alternam</h2>
    <p class="lead">Dia A na segunda, quarta e sexta; Dia B na terça, quinta e sábado. Domingo é livre. Toque num dia para ver o cardápio.</p>
    <div class="semana">${semana}</div>
    <p class="legenda"><span><i></i>Quarta à noite: ${LEMBRETE}</span></p></section>`;
  if (sel === 'L') {
    html += `<section class="card livre-card" data-dia="L"><h3 class="h3">Domingo livre</h3><p>Sem cardápio: você monta as refeições no seu horário, com as <button type="button" class="link" data-goto="trocas">trocas</button>. Aos domingos, a aba Hoje mostra os lembretes do dia.</p></section>`;
  } else {
    const D = PLAN.dias[sel];
    html += `<section class="dia-head" data-dia="${sel}"><div><p class="eyebrow">${esc(D.quando)}</p><h2 class="h2">${D.nome}</h2></div>
      <dl class="nums"><div><dt>Total do dia</dt><dd>${fmt(D.kcal)} <small>kcal</small></dd></div><div><dt>Plano</dt><dd>1.400 <small>kcal</small></dd></div><div><dt>Marmitas</dt><dd>${tapeSm(MARM[sel][0])} ${tapeSm(MARM[sel][1])}</dd></div></dl>
      ${macrosTiles(D.macros)}
      <p class="hint">Comparado com referências gerais, não com metas da nutróloga. <button type="button" class="link" data-goto="macros">Ver a comparação</button></p></section>
      <div class="meals" data-dia="${sel}">${D.refeicoes.map(m => mealCard(m)).join('')}</div>`;
  }
  keepFocus(() => { $('#v-cardapio').innerHTML = html; });
}

/* ---------- Preparo ---------- */
function renderPreparo() {
  const marm = PLAN.marmitas.map(m => `<article class="marm" data-dia="${m.dia}">
      <div class="marm-top"><span class="tape">${m.codigo}</span><span class="marm-x">×${m.qtd}</span></div>

function textoFalta() {

/* ---------- Peso ---------- */
let apagarArmado = null, apagarTimer = null;
function graficoPeso(rs, meta) {
  const u = rs[rs.length - 1], ini = rs[0];
  if (rs.length < 2) return `<h3 class="h3">Primeiro registro salvo</h3><p class="hint">O gráfico aparece a partir do segundo registro.</p>`;
  const dif = u.kg - ini.kg;
  const titulo = dif < 0 ? `Você perdeu ${fmtKg(-dif)} kg desde ${fmtDataCurta(ini.d)}`
    : dif > 0 ? `Você subiu ${fmtKg(dif)} kg desde ${fmtDataCurta(ini.d)}` : `Peso estável desde ${fmtDataCurta(ini.d)}`;
  const W = 340, H = 180, L = 36, R = 14, T = 22, B = 24;
  const xs = rs.map(x => Date.parse(x.d)), ys = rs.map(x => x.kg);
  let lo = Math.min(...ys), hi = Math.max(...ys);
  if (meta != null) { lo = Math.min(lo, meta); hi = Math.max(hi, meta); }
  const faixa = Math.max(hi - lo, 2);
  const step = [0.5, 1, 2, 5, 10, 20].find(s => faixa / s <= 4) || 20;
  lo = Math.floor((lo - faixa * 0.06) / step) * step;
  hi = Math.ceil((hi + faixa * 0.06) / step) * step;
  const x0 = xs[0], x1 = xs[xs.length - 1];
  const X = t => L + (t - x0) / (x1 - x0) * (W - L - R);
  const Y = v => T + (hi - v) / (hi - lo) * (H - T - B);
  let grade = '';
  for (let v = lo; v <= hi + 1e-9; v += step) {
    grade += `<line x1="${L}" x2="${W - R}" y1="${Y(v).toFixed(1)}" y2="${Y(v).toFixed(1)}" stroke="var(--line)" stroke-width="1"/><text x="${L - 6}" y="${(Y(v) + 3.5).toFixed(1)}" text-anchor="end" font-size="10.5" fill="var(--ink-2)">${fmtKgEixo(v)}</text>`;
  }
  const metaLinha = meta != null
    ? `<line x1="${L}" x2="${W - R}" y1="${Y(meta).toFixed(1)}" y2="${Y(meta).toFixed(1)}" stroke="var(--ink-2)" stroke-width="1.5" stroke-dasharray="4 4"/><text x="${L + 4}" y="${(Y(meta) - 5).toFixed(1)}" font-size="11" fill="var(--ink-2)">meta ${fmtKg(meta)} kg</text>` : '';
  const linha = `<polyline points="${rs.map((x, i) => `${X(xs[i]).toFixed(1)},${Y(x.kg).toFixed(1)}`).join(' ')}" fill="none" stroke="var(--b)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>`;
  const pontos = rs.map((x, i) => { const ult = i === rs.length - 1; return `<circle cx="${X(xs[i]).toFixed(1)}" cy="${Y(x.kg).toFixed(1)}" r="${ult ? 5 : 4}" fill="${ult ? 'var(--b)' : 'var(--surface)'}" stroke="var(--b)" stroke-width="2"><title>${fmtData(x.d)}: ${fmtKg(x.kg)} kg</title></circle>`; }).join('');
  const rotulo = `<text x="${(W - R).toFixed(1)}" y="${(Y(u.kg) - 10).toFixed(1)}" text-anchor="end" font-size="12" font-weight="700" fill="var(--ink)">${fmtKg(u.kg)} kg</text>`;
  const eixoX = `<text x="${L}" y="${H - 6}" font-size="10.5" fill="var(--ink-2)">${fmtDataCurta(ini.d)}</text><text x="${W - R}" y="${H - 6}" text-anchor="end" font-size="10.5" fill="var(--ink-2)">${fmtDataCurta(u.d)}</text>`;
  return `<h3 class="h3">${titulo}</h3><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(titulo)}">${grade}${metaLinha}${linha}${pontos}${rotulo}${eixoX}</svg>`;
}
function renderPeso() {
  const p = pesoState(), rs = p.registros, m = metaAgua(p);
  const u = rs[rs.length - 1] || null, ini = rs[0] || null;
  const hojeISO = dateKey(today);
  let html = `<section class="block"><p class="eyebrow">Acompanhamento</p><h2 class="h2">Peso e água</h2>
    <p class="lead">Registre o peso uma vez por semana. A meta de água é recalculada pelo último peso.</p></section>
    <form class="card" id="form-peso" autocomplete="off" novalidate>
      <h3 class="h3">Peso da semana</h3>
      <div class="campos">
        <label class="campo" for="peso-kg"><span>Peso (kg)</span><input id="peso-kg" name="kg" type="text" inputmode="decimal" placeholder="ex.: 97,5"></label>
        <label class="campo" for="peso-data"><span>Data</span><input id="peso-data" name="d" type="date" value="${hojeISO}" max="${hojeISO}"></label>
        <button type="submit" class="btn">Salvar</button>
      </div>
      <p class="hint">A nutróloga recomenda se pesar só nas consultas, porque uma balança difere da outra. Pesando toda semana, use sempre a mesma balança, no mesmo horário e de preferência em jejum.</p>
    </form>`;
  if (u) {
    const dif = rs.length > 1 ? u.kg - ini.kg : null;
    const falta = p.meta != null ? u.kg - p.meta : null;
    html += `<dl class="stats">
      <div><dt>Peso atual</dt><dd>${fmtKg(u.kg)} kg<small>em ${fmtData(u.d)}</small></dd></div>
      <div><dt>Desde o início</dt><dd>${dif == null ? '—' : (dif > 0 ? '+' : dif < 0 ? '−' : '') + fmtKg(Math.abs(dif)) + ' kg'}<small>desde ${fmtData(ini.d)}</small></dd></div>
      <div><dt>Meta de peso</dt><dd>${p.meta != null ? fmtKg(p.meta) + ' kg' : '—'}<small>${falta == null ? 'defina em Metas' : falta > 0 ? 'faltam ' + fmtKg(falta) + ' kg' : 'meta alcançada'}</small></dd></div>
      <div><dt>Água por dia</dt><dd>${fmtL(m.ml)} L<small>${p.fator} mL por kg, mínimo 2 L</small></dd></div>
    </dl>
    <section class="card grafico">${graficoPeso(rs, p.meta)}</section>`;
  }
  html += `<form class="card" id="form-metas" autocomplete="off" novalidate>
      <h3 class="h3">Metas</h3>
      <div class="campos">
        <label class="campo" for="meta-kg"><span>Meta de peso (kg, opcional)</span><input id="meta-kg" type="text" inputmode="decimal" value="${p.meta != null ? fmtKg(p.meta) : ''}" placeholder="ex.: 75"></label>
        <label class="campo" for="fator-agua"><span>Água por kg de peso (mL)</span><input id="fator-agua" type="text" inputmode="numeric" value="${p.fator}"></label>
        <button type="submit" class="btn ghost">Salvar metas</button>
      </div>
      <p class="hint">A regra usual para adultos é de 30 a 35 mL de água por kg de peso (<a href="${esc(PLAN.fontes.agua.url)}" target="_blank" rel="noopener">fonte</a>). A meta nunca fica abaixo dos 2 L da nutróloga. Quem tem doença nos rins ou no coração deve combinar esse valor com o médico.</p>
    </form>`;
  if (rs.length) {
    const desc = rs.slice().reverse();
    const lista = desc.map((x, i) => {
      const ant = desc[i + 1];
      const d = ant ? x.kg - ant.kg : null;
      const dtxt = d == null ? '' : `${d > 0 ? '+' : d < 0 ? '−' : '±'}${fmtKg(Math.abs(d))}`;
      const arm = apagarArmado === x.d;
      return `<li><span class="rd">${fmtData(x.d)}</span><span class="rk">${fmtKg(x.kg)} kg</span>${dtxt ? `<span class="rv">${dtxt}</span>` : ''}<button type="button" class="del${arm ? ' armado' : ''}" id="del-${x.d}" data-del-peso="${x.d}">${arm ? 'Apagar?' : 'Apagar'}</button></li>`;
    }).join('');
    html += `<section class="card"><h3 class="h3">Registros</h3><ul class="registros">${lista}</ul></section>`;
  }
  html += `<p class="sync" data-sync><i></i><span></span></p>`;
  keepFocus(() => { $('#v-peso').innerHTML = html; });
  store.paint();
}
function savePeso(mut) {
  const next = JSON.parse(JSON.stringify(store.get('peso') || {}));
  mut(next);
  store.set('peso', next);
  renderPeso(); renderHoje();
}

/* ---------- Ações ---------- */
function irQuadro(q) {
  go('guia');
  requestAnimationFrame(() => {
    const el = document.getElementById('q-' + q);
    if (!el) return;
    el.scrollIntoView({ behavior: reduzMovimento() ? 'auto' : 'smooth', block: 'start' });
    el.classList.remove('flash'); void el.offsetWidth; el.classList.add('flash');
  });
}
function irPara(alvo) {
  if (alvo === 'sopa') {
    go('preparo');
    requestAnimationFrame(() => { const d = $('#rec-sopa'); if (d) { d.open = true; d.scrollIntoView({ behavior: reduzMovimento() ? 'auto' : 'smooth', block: 'start' }); } });
  } else if (alvo === 'trocas' || alvo === 'macros') {
    go('guia');
    requestAnimationFrame(() => { const s = $('#g-' + alvo); if (s) s.scrollIntoView({ behavior: reduzMovimento() ? 'auto' : 'smooth', block: 'start' }); });
  } else if (VIEWS.includes(alvo)) go(alvo);
}
document.addEventListener('click', e => {
  const t = e.target.closest('button');
  if (!t) return;
  if (t.matches('[data-set-dia]')) {
    const v = t.dataset.setDia, prog = DOW_DIA[today.getDay()];
    patchHoje(s => { if (v === prog) delete s.dia; else s.dia = v; });
  } else if (t.matches('.check[data-meal]')) {
    const id = t.dataset.meal;
    patchHoje(s => { s.feitos = s.feitos || {}; if (s.feitos[id]) delete s.feitos[id]; else s.feitos[id] = true; });
  } else if (t.matches('.copo[data-copo]')) {
    const n = Number(t.dataset.copo);
    patchHoje(s => { const cur = Number(s.agua) || 0; s.agua = cur === n ? n - 1 : n; });
  } else if (t.matches('.q[data-q]')) {
    irQuadro(t.dataset.q);
  } else if (t.matches('[data-goto]')) {
    irPara(t.dataset.goto);
  } else if (t.matches('[data-ver]')) {
    verDia = t.dataset.ver; renderCardapio();
  } else if (t.matches('[data-jump]')) {
    const el = document.getElementById(t.dataset.jump);
    if (el) el.scrollIntoView({ behavior: reduzMovimento() ? 'auto' : 'smooth', block: 'start' });
  } else if (t.matches('[data-del-peso]')) {
    const d = t.dataset.delPeso;
    if (apagarArmado !== d) {
      apagarArmado = d; clearTimeout(apagarTimer);
      apagarTimer = setTimeout(() => { apagarArmado = null; renderPeso(); }, 4000);
      renderPeso();
      return;
    }
    clearTimeout(apagarTimer); apagarArmado = null;
    savePeso(s => { s.registros = (Array.isArray(s.registros) ? s.registros : []).filter(x => x && x.d !== d); });
    toast('Registro apagado');
  } else if (t.id === 'btn-copiar') {
    copiar();
  } else if (t.id === 'btn-limpar') {
    limpar(t);
  } else if (t.id === 'instalar-ok') {
    try { localStorage.setItem('plano1400:instalar-ok', '1'); } catch (e) { /* sem armazenamento */ }
    renderHoje();
  }
});
document.addEventListener('change', e => {
  const t = e.target;
  if (!t.matches || !t.matches('[data-compra]')) return;
  const cur = store.get('compras') || {};
  const marcados = Object.assign({}, cur.marcados || {});
  if (t.checked) marcados[t.dataset.compra] = true; else delete marcados[t.dataset.compra];
  store.set('compras', { marcados });
  renderCompras();
});

document.addEventListener('submit', e => {
  const f = e.target;
  if (f.id === 'form-peso') {
    e.preventDefault();
    const kg = num($('#peso-kg').value);
    const d = $('#peso-data').value || dateKey(today);
    if (!(kg >= 30 && kg <= 300)) { toast('Digite o peso em kg, por exemplo 97,5'); $('#peso-kg').focus(); return; }
    if (!/^\d{4}-\d{2}-\d{2}$/.test(d) || d > dateKey(today)) { toast('Escolha uma data até hoje'); return; }
    savePeso(s => {
      const rs = (Array.isArray(s.registros) ? s.registros : []).filter(x => x && x.d !== d);
      rs.push({ d, kg: Math.round(kg * 10) / 10 });
      rs.sort((a, b) => (a.d < b.d ? -1 : a.d > b.d ? 1 : 0));
      s.registros = rs;
    });
    toast(`Peso salvo: ${fmtKg(kg)} kg`);
  } else if (f.id === 'form-metas') {
    e.preventDefault();
    const metaTxt = $('#meta-kg').value.trim();
    const meta = metaTxt === '' ? null : num(metaTxt);
    const fator = num($('#fator-agua').value);
    if (meta !== null && !(meta >= 30 && meta <= 300)) { toast('Digite a meta em kg, por exemplo 75'); return; }
    if (!(fator >= 20 && fator <= 50)) { toast('Use de 20 a 50 mL por kg'); return; }
    savePeso(s => { if (meta === null) delete s.meta; else s.meta = Math.round(meta * 10) / 10; s.fator = Math.round(fator); });
    toast('Metas salvas');
  }
});

/* ---------- Virada do dia com a página aberta ---------- */
function checarVirada() {
  const agora = new Date();
  const k = 'dia-' + dateKey(agora);
  if (k === todayKey) return;
  store.unwatch(todayKey);
  today = agora; todayKey = k;
  store.watch(todayKey);
  verDia = null;
  renderHoje(); renderCardapio();
}
setInterval(checarVirada, 60000);
document.addEventListener('visibilitychange', () => { if (!document.hidden) checarVirada(); });

store.onChange = k => {
  if (k === todayKey) renderHoje();
  else if (k === 'compras') renderCompras();
  else if (k === 'peso') { renderPeso(); renderHoje(); }
};
renderHoje(); renderCardapio(); renderPreparo(); renderCompras(); renderPeso(); renderGuia();
show(location.hash.slice(1) || 'hoje', { keepScroll: true });
store.init(() => [todayKey, 'compras', 'peso']);
})();
</script>

if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost' || location.hostname === '127.0.0.1')) {
  window.addEventListener('load', () => { navigator.serviceWorker.register('./sw.js').catch(() => {}); });
}
</script>
